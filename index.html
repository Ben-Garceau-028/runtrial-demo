<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Insights</title>
<style>
:root{color-scheme:dark;--page:#2d3035;--surface:#24272b;--ink:#f3f1ec;--ink2:#cbc8c0;--axis:#4b4f56;--neon:#ff5a2c;--critical:#ff9d8a;
  --glow:linear-gradient(90deg,#ff8a3d,#ff4b2b,#e0245e,#ff8a3d);--arcade:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#24272b;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.stage{position:fixed;inset:0;display:grid;place-items:center;perspective:900px}
.ring{position:absolute;width:min(520px,118vw);aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 12%,#ff8a3d 22%,#ff4b2b 34%,transparent 46% 58%,#e0245e 72%,#ff8a3d 84%,transparent 96%);
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  filter:drop-shadow(0 0 18px rgba(255,90,44,.65));animation:spin 9s linear infinite;transition:transform 1.25s cubic-bezier(.6,0,.9,.4),opacity 1.25s}
.ring.b{width:min(440px,100vw);animation:spin 13s linear infinite reverse;opacity:.6}
@keyframes spin{to{rotate:360deg}}
form{position:relative;width:min(340px,86vw);text-align:center;padding:26px 24px;border-radius:14px;background:rgba(36,39,43,.72);border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform 1.1s cubic-bezier(.6,0,.9,.4),opacity .8s}
h1{font-family:var(--arcade);text-transform:uppercase;letter-spacing:.22em;font-size:26px;margin:0 0 2px;width:fit-content;margin-inline:auto;
  background:var(--glow);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 5s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
p{margin:0 0 16px;color:var(--ink2);font-family:var(--arcade);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
input,button{font:inherit;width:100%;padding:11px 12px;border-radius:8px}
input{text-align:center;letter-spacing:.2em;border:2px solid var(--axis);background:rgba(0,0,0,.28);color:var(--ink)}
button{margin-top:12px;border:0;font-family:var(--arcade);text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:#141414;cursor:pointer;
  background:var(--glow);background-size:200% 100%;animation:flow 5s linear infinite}
button:disabled{opacity:.7;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#msg{color:var(--critical);min-height:1.5em;margin:12px 0 0;font:600 14px/1.5 system-ui,sans-serif;letter-spacing:0;text-transform:none}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0%,#ff8a3d 30%,#ff4b2b 55%,rgba(36,39,43,0) 75%);opacity:0;transform:scale(.1);pointer-events:none}
body.open .ring{transform:scale(9);opacity:0}
body.open form{transform:translateZ(520px) scale(1.5);opacity:0}
body.open #flash{animation:burst 1.35s cubic-bezier(.5,0,.8,.5) forwards}
@keyframes burst{30%{opacity:.25}100%{opacity:1;transform:scale(4)}}
@media (prefers-reduced-motion:reduce){.ring,h1,button{animation:none}body.open .ring,body.open form{transition:none}body.open #flash{animation:none}}
</style>
</head>

<div class="stage">

    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button id="b">Enter &#9654;</button>
    <div id="msg" role="alert"></div>
  </form>

<script>
(function(){
// a grid floor and passing lights, drawn in perspective; they accelerate when the portal opens
const cv=document.getElementById('sky'),ctx=cv.getContext('2d'),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,speed=1,z0=0,last=0,stars=[];
function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:90},(_,i)=>({a:i*2.399,r:0.08+((i*37)%100)/100,z:((i*61)%100)/100}));}
function draw(now){
  const dt=Math.min(3,(now-last)/16.7||1);last=now;z0=(z0+0.012*speed*dt)%1;
  const cx=W/2,hy=H*0.54;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#22252a');g.addColorStop(.54,'#3a3134');g.addColorStop(.541,'#2b2423');g.addColorStop(1,'#24272b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const glow=ctx.createRadialGradient(cx,hy,0,cx,hy,Math.max(W,H)*.5);glow.addColorStop(0,'rgba(255,90,44,.34)');glow.addColorStop(1,'rgba(255,90,44,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  ctx.lineWidth=1;
  for(let i=-14;i<=14;i++){ctx.strokeStyle='rgba(255,138,61,'+(0.10+0.16*(1-Math.abs(i)/14))+')';ctx.beginPath();ctx.moveTo(cx,hy);ctx.lineTo(cx+i*W*0.16,H);ctx.stroke();}
  for(let k=0;k<16;k++){const z=((k+z0)/16),y=hy+(H-hy)*z*z;ctx.strokeStyle='rgba(255,138,61,'+(0.05+0.3*z)+')';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  stars.forEach(s=>{s.z+=0.004*speed*dt;if(s.z>1)s.z-=1;const r=s.r*s.z*Math.max(W,H)*0.75,x=cx+Math.cos(s.a)*r,y=hy-Math.abs(Math.sin(s.a))*r*0.62-4;
    const len=Math.min(60,1+speed*s.z*5);ctx.strokeStyle='rgba(243,241,236,'+(0.15+0.75*s.z)+')';ctx.lineWidth=1+s.z;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-Math.cos(s.a)*len,y+Math.abs(Math.sin(s.a))*len*0.62);ctx.stroke();});
  if(!calm)requestAnimationFrame(draw);
}
size();addEventListener('resize',()=>{size();if(calm)draw(0);});requestAnimationFrame(draw);

const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById('f'),msg=document.getElementById('msg'),b=document.getElementById('b'),tag=document.getElementById('tag');
f.addEventListener('submit',async e=>{
  e.preventDefault();msg.textContent='';b.disabled=true;b.textContent='Verifying…';
  try{
    if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec('z30DB8KkTNvUM6M6ynMPRQ=='),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec('r07dh1vG4gJ1GfyH')},key,dec(document.getElementById('c').textContent.trim()));
    const html=new TextDecoder().decode(plain);
    tag.textContent='Access granted';b.textContent='Opening the portal';
    const enter=()=>{document.open();document.write(html);document.close();};
    if(calm)enter();
    else{document.body.classList.add('open');const t0=performance.now();(function ramp(n){speed=1+Math.min(1,(n-t0)/1200)*26;if(n-t0<1350)requestAnimationFrame(ramp);})(t0);setTimeout(enter,1350);}
  }catch(err){
    msg.textContent=err.message==='nocrypto'?'This browser cannot open Insights. Try a current version of Chrome, Safari or Firefox.':'That code did not work.';
    b.disabled=false;b.textContent='Enter \u25B6';
  }
});
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Insights</title>
<style>
:root{color-scheme:dark;--page:#130e33;--surface:#1f1750;--ink:#f4f2ff;--ink2:#cfcaf0;--axis:#41378a;--neon:#22d3ee;--critical:#e66767;
  --glow:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5fd2,#22d3ee);--arcade:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(120deg,#130e33,#2a1166,#0f2c52,#130e33);background-size:300% 300%;animation:drift 24s ease-in-out infinite;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
form{background:var(--surface);border:2px solid var(--axis);border-radius:6px;padding:30px;width:min(380px,92vw);text-align:center}
h1{font-family:var(--arcade);text-transform:uppercase;letter-spacing:.12em;font-size:28px;width:fit-content;
  background:var(--glow);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(3px 3px 0 rgba(0,0,0,.45));animation:flow 5s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
@keyframes drift{50%{background-position:100% 50%}}
@media (prefers-reduced-motion:reduce){h1,button,body{animation:none!important}}
h1{margin:0 auto 6px}
p{margin:0 0 16px;color:var(--ink2)}
input,button{font:inherit;width:100%;padding:10px 12px;border-radius:4px;border:2px solid var(--axis);background:var(--page);color:var(--ink)}
input{text-align:center}
button{margin-top:14px;font-family:var(--arcade);text-transform:uppercase;letter-spacing:.1em;background:var(--glow);background-size:200% 100%;animation:flow 5s linear infinite;border-color:transparent;color:#0b0b0b;font-weight:700;cursor:pointer;box-shadow:4px 4px 0 #0b0730}
button:active:not(:disabled){transform:translate(4px,4px);box-shadow:none}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
canvas{display:block;width:100%;height:138px;image-rendering:pixelated;image-rendering:crisp-edges;margin-bottom:14px;background:linear-gradient(#150c3d,#3a1a6b 72%,#7a2a80);border-radius:4px}
#msg{color:var(--critical);min-height:1.5em;margin:14px 0 0;font-weight:600}
</style>
</head>
<body>
<form id="f">
  <canvas id="track" aria-hidden="true"></canvas>
  <h1>Insights</h1>
  <p>Enter the password to play.</p>
  <label for="pw" style="position:absolute;left:-9999px">Password</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
  <button id="b">&#9654; Start</button>
  <p id="msg" role="alert"></p>
</form>

<script>
/* An original pixel-art runner: sprints along a track, jumps hurdles, collects medals. Decorative only. */
function RunnerStrip(cv, hud) {
  const S = 3, H = 46, GY = 38, RX = 34, ctx = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, dist = 0, score = 0, mile = 0, boost = 0, objs = [], next = 40, last = 0, stars = [], seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  const limb = (x, y, a, len, c) => { for (let i = 0; i <= len; i++) px(x + Math.sin(a) * i - 0.5, y + Math.cos(a) * i, 2, 2, c);
    return [x + Math.sin(a) * len, y + Math.cos(a) * len]; };
  const leg = (x, y, ph, c) => { const a = Math.sin(ph) * 0.95, k = limb(x, y, a, 5, c), f = limb(k[0], k[1], a - 0.15 - Math.max(0, Math.cos(ph)) * 1.3, 5, c);
    px(f[0] - 1, f[1] + 1, 4, 2, '#e66767'); };
  const arm = (x, y, ph, c) => { const a = Math.sin(ph) * 1.0, e = limb(x, y, a, 3, c); limb(e[0], e[1], a + 1.3, 3, c); };
  function runner(ph, air) {
    const x = RX, y = GY - 11 - air - (air ? 0 : Math.abs(Math.sin(ph)));
    leg(x, y, ph + Math.PI, '#b98e6a'); arm(x + 1, y - 9, ph, '#b98e6a');
    px(x - 2, y - 10, 5, 9, '#22d3ee'); px(x - 2, y - 2, 5, 3, '#ff5fd2');           // singlet and shorts
    px(x - 1, y - 16, 5, 5, '#e8b48a'); px(x - 1, y - 16, 5, 1, '#199e70'); px(x - 3, y - 15, 2, 1, '#199e70');   // head, headband and its tail
    px(x + 3, y - 14, 1, 1, '#0b0b0b');
    leg(x, y, ph, '#e8b48a'); arm(x + 1, y - 9, ph + Math.PI, '#e8b48a');
  }
  const draw = {
    hurdle: o => { px(o.x, GY - 8, 1, 10, '#c3c2b7'); px(o.x + 6, GY - 8, 1, 10, '#c3c2b7'); px(o.x, GY - 9, 7, 2, '#f0efec'); px(o.x + 2, GY - 9, 3, 2, '#e66767'); },
    medal: o => { const y = o.y + Math.sin(dist / 9 + o.x) * 1.5; px(o.x + 1, y - 3, 1, 3, '#f4f2ff'); px(o.x + 3, y - 3, 1, 3, '#f4f2ff');
      px(o.x + 1, y, 3, 5, '#ff5fd2'); px(o.x, y + 1, 5, 3, '#ff5fd2'); px(o.x + 1, y + 1, 1, 1, '#fff'); },
    flag: o => { px(o.x, GY - 16, 1, 18, '#c3c2b7'); px(o.x + 1, GY - 16, 7, 5, '#22d3ee'); px(o.x + 3, GY - 14, 3, 1, '#f0efec'); },
    spark: o => { const r = 8 - o.life / 2; [[r, 0], [-r, 0], [0, r], [0, -r], [r * .7, r * .7], [-r * .7, -r * .7], [r * .7, -r * .7], [-r * .7, r * .7]]
      .forEach(d => px(o.x + d[0], o.y + d[1], 1, 1, '#ffffff')); }
  };
  function size() { W = Math.max(120, Math.ceil(cv.clientWidth / S)); cv.width = W; cv.height = H;
    stars = Array.from({ length: Math.floor(W / 12) }, (_, i) => [(i * 97) % W, (i * 53) % 20 + 2, i % 3]); }
  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.7 || 1); last = now;
    const v = (1.0 + boost * 1.4) * dt; dist += v; next -= v;
    if (next <= 0) { const r = rnd(), far = W + 10;
      if (r < 0.4) objs.push({ type: 'hurdle', x: far });
      else if (r < 0.85) objs.push({ type: 'medal', x: far, y: GY - 24 });
      else { objs.push({ type: 'hurdle', x: far }); objs.push({ type: 'medal', x: far + 1, y: GY - 34 }); }
      next = 46 + rnd() * 70; }
    if (Math.floor(dist / 420) > mile) { mile++; objs.push({ type: 'flag', x: W + 10 }); }
    let air = 0;
    for (const o of objs) {
      if (o.type === 'spark') { o.life -= dt; continue; }
      o.x -= v;
      if (o.type === 'hurdle') { const d = (o.x + 3 - RX) / 15; if (Math.abs(d) < 1) air = Math.max(air, 14 * (1 - d * d));
        if (!o.done && o.x + 7 < RX - 3) { o.done = true; score += 50; } }
      if (o.type === 'medal' && !o.done && o.x <= RX + 3) { o.done = true; score += 100; objs.push({ type: 'spark', x: RX + 2, y: o.y + 2, life: 14 }); }
    }
    objs = objs.filter(o => (o.type === 'spark' ? o.life > 0 : o.x > -12 && !(o.type === 'medal' && o.done)));
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => px(((s[0] - dist * 0.08) % W + W) % W, s[1], 1, 1, (Math.floor(now / 500) + s[2]) % 3 ? '#8f86d6' : '#ffffff'));
    px(0, GY + 2, W, 1, 'hsl(' + Math.round(250 + 65 * Math.sin(now / 1500)) + ',90%,66%)');
    for (let x = -(dist % 14); x < W; x += 14) px(x, GY + 5, 7, 1, '#6a5fc0');
    objs.forEach(o => draw[o.type](o));
    runner(dist / 5.2, air);
    if (hud) hud.textContent = 'SCORE ' + String(score).padStart(5, '0') + '   MILE ' + mile;
    if (!still) requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', size);
  if (still) { objs.push({ type: 'hurdle', x: RX + 40 }, { type: 'medal', x: RX + 70, y: GY - 24 }); frame(0); addEventListener('resize', () => frame(0)); }
  else requestAnimationFrame(frame);
  return { boost: b => { boost = b ? 1 : 0; } };
}

RunnerStrip(document.getElementById('track'),null);
</script>
<script>
(function(){
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById('f'), msg=document.getElementById('msg'), b=document.getElementById('b');
f.addEventListener('submit',async e=>{
  e.preventDefault(); msg.textContent=''; b.disabled=true; b.textContent='Opening…';
  try{
    if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec('jna2eJW7xPJfnLgS5oLCdw=='),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec('WJTI6t87fQ/qH0Rn')},key,dec(document.getElementById('c').textContent.trim()));
    const html=new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(err){
    msg.textContent=err.message==='nocrypto'?'This browser cannot open the demo. Try a current version of Chrome, Safari or Firefox.':'That password did not work.';
    b.disabled=false; b.textContent='\u25B6 Start';
  }
});
})();
</script>

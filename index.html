<style>
:root{color-scheme:light;--bg:#f1efe8;--ink:#15170f;--ink2:#7b7d72;--rule:#bfbcb0;--critical:#b02a2a}



*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;transition:opacity .7s ease}
body.leaving{opacity:0}
form{position:relative;width:min(260px,80vw);text-align:center}
h1{font-size:clamp(34px,7vw,64px);font-weight:500;letter-spacing:-.035em;line-height:.92;text-transform:uppercase;margin:0 0 46px}
input{width:100%;font:inherit;font-size:16px;text-align:center;letter-spacing:.3em;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:8px 0 10px;outline:0}
input:focus,input:focus-visible{outline:0;border-bottom-color:var(--ink)}
button{margin-top:26px;font:inherit;font-size:11px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--ink2);background:transparent;border:0;padding:8px 10px 8px 14px;cursor:pointer}
button:hover{color:var(--ink)}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
button:disabled{opacity:.5;cursor:default}
#msg{min-height:1.5em;margin-top:14px;color:var(--critical);font-size:12.5px}
@media (prefers-reduced-motion:reduce){body{transition:none}}

/* logo */
h1.logo{display:flex;align-items:center;gap:.28em;letter-spacing:.06em!important;font-weight:700!important}
h1.logo .imark{width:.82em;height:.82em;flex:none}

<script>
(function(){
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById('f'),msg=document.getElementById('msg'),b=document.getElementById('b');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
f.addEventListener('submit',async e=>{
  e.preventDefault();msg.textContent='';b.disabled=true;
  try{
    if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec('l8yyYWwx3/j2g4NkVQqKuw=='),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec('mTtUc50e6OWfDqCA')},key,dec(document.getElementById('c').textContent.trim()));
    const html=new TextDecoder().decode(plain);
    const enter=()=>{document.open();document.write(html);document.close();};
    if(calm)enter();else{document.body.classList.add('leaving');setTimeout(enter,720);}
  }catch(err){
    msg.textContent=err.message==='nocrypto'?'This browser cannot open Insights. Try a current version of Chrome, Safari or Firefox.':'Not recognized';
    b.disabled=false;
  }
});
})();
</script>
